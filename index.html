<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome — OlutionCore</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* gradient background */
            background: linear-gradient(
                    135deg,
                    #2b5876 0%,
                    #4e4376 100%
            );
            background-size: cover;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            text-align: center;
        }
        img {
            max-width: 40%;         /* current size */
            height: auto;
            margin-bottom: 2.5rem;  /* separation */
            object-fit: contain;
        }
        .tagline {
            font-size: 1.25rem;
            font-weight: 300;
            letter-spacing: 0.02em;
            max-width: 80%;
        }
        .contact {
            margin-top: 1rem;
            font-size: 1rem;
            font-weight: 200;
        }
        .contact a {
            color: #ddd;
            text-decoration: none;
        }
        .contact a:hover {
            text-decoration: underline;
        }
        @media (min-width: 600px) {
            img {
                max-width: 20%;
            }
            .tagline {
                font-size: 1.5rem;
            }
            .contact {
                font-size: 1.125rem;
            }
        }
    </style>
</head>
<body>
<img src="logo.svg" alt="OlutionCore Logo">
<div class="tagline">OlutionCore — things are easy with us.</div>
<div class="contact">
    <a href="mailto:info@olutioncore.com">info@olutioncore.com</a>
</div>
</body>
</html>
